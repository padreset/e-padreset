name: unit-tests

# JVM unit tests, on every push and every pull request.
#
# These need the Android SDK (unlike detekt), so this workflow installs it via
# setup-android. No device or emulator: :app:testDebugUnitTest covers parsers,
# protocol and write rules only. The verifyPrinterData asset guard runs too,
# because it is wired to preBuild.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. Nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default is `tools platform-tools`, and the legacy `tools`
          # package no longer resolves: sdkmanager exits 1 and the job dies before
          # Gradle starts. platform-tools is the only piece needed here; AGP
          # downloads the platform and build-tools that compileSdk asks for.
          packages: "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: unit-tests-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            unit-tests-${{ runner.os }}-gradle-

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Independent framing check for the ESC/P2 maintenance jobs: escapy is a
      # separate ESC/P2 implementation, and parsing our built bytes with it
      # validates our remote-command length fields without hardware. The pin
      # lives in the script (ESCAPY_PIN); keep the install line identical.
      - name: Cross-check ESC/P2 jobs with escapy
        run: |
          pip install 'git+https://github.com/ysard/escapy@747055eaf12704a655c979bcb1c2de82db651870'
          ./gradlew :app:dumpEscp2Jobs --console=plain --stacktrace
          python3 scripts/validate-escp2-with-escapy.py app/build/escp2

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
