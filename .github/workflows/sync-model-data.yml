name: Sync model data

# The bundled model data is a copy of reinkpy's, and reinkpy gains and
# reclassifies models without telling anyone. Nothing in this repository noticed
# that before, which is how the committed list drifted two models behind the
# upstream it claims to mirror.
#
# The script verifies devices.xml against reinkpy before it writes anything, and
# refuses to write when the two sources disagree — the reinkpy-only models it
# adds have no other evidence behind them, so a divergence has to be looked at
# by a person. A red run here means exactly that.
#
# It opens a pull request rather than committing directly because the diff is a
# claim about hardware: someone should read it before it ships.
on:
  schedule:
    # Mondays at 06:17 UTC. Not on the hour: GitHub's scheduler is busiest then.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Exits 0 and keeps the committed assets when the upstream is unreachable,
      # so a network blip does not open an empty pull request or fail the run.
      # It exits 1 when the cross-check fails, which is the case worth waking up
      # for, and the step below then never runs.
      - name: Verify the sources and regenerate the model data
        run: node scripts/sync-model-data.mjs

      - name: Open a pull request when an asset changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            app/src/main/assets/maintenance_boxes.xml
            app/src/main/assets/reinkpy_models.xml
          )
          if git diff --quiet -- "${assets[@]}"; then
            echo "Up to date with reinkpy; nothing to open."
            exit 0
          fi

          branch=sync/model-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "${assets[@]}"
          git commit -m "Sync the model data from reinkpy"
          git push --force-with-lease -u origin "$branch"

          # Fails when a pull request for this branch is already open, which is
          # the normal case on the second run: the force-push above already
          # updated it, so there is nothing to do.
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "Sync the model data from reinkpy" \
            --body "Regenerated by \`scripts/sync-model-data.mjs\`. The cross-check against devices.xml passed, so the two sources still agree. Review the added and reclassified models before merging." \
            || echo "A pull request for $branch already exists; it was updated."

